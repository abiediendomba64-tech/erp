name: Deploy Google Apps Script production

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Type DEPLOY only after verifying the production Script ID and deployment ID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apps-script-production-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    if: ${{ inputs.confirm_target == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate application
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Configure and validate clasp target
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
          EXPECTED_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON" || { echo "::error::Missing CLASPRC_JSON secret"; exit 1; }
          test -n "$CLASP_JSON" || { echo "::error::Missing CLASP_JSON secret"; exit 1; }
          test -n "$EXPECTED_SCRIPT_ID" || { echo "::error::Set production environment variable GAS_SCRIPT_ID to the approved Apps Script Script ID"; exit 1; }
          test -n "$GAS_DEPLOYMENT_ID" || { echo "::error::Set GAS_DEPLOYMENT_ID to the existing Web App deployment ID; initial deployment is intentionally not automated"; exit 1; }

          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json
          chmod 600 "$HOME/.clasprc.json" .clasp.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cfg = JSON.parse(fs.readFileSync('.clasp.json', 'utf8'));
          const expected = process.env.EXPECTED_SCRIPT_ID;
          if (!cfg.scriptId || cfg.scriptId !== expected) {
            throw new Error('Configured scriptId does not match approved production GAS_SCRIPT_ID.');
          }
          if (cfg.rootDir !== 'google-apps-script') {
            throw new Error('CLASP_JSON.rootDir must be google-apps-script.');
          }
          for (const file of ['appsscript.json', 'Code.gs', 'Security.gs', 'Wrapper.html']) {
            if (!fs.existsSync('google-apps-script/' + file)) {
              throw new Error('Required Apps Script file missing: google-apps-script/' + file);
            }
          }
          NODE

      - name: Push source without force
        run: npx --yes @google/clasp push

      - name: Update existing Web App deployment
        env:
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: npx --yes @google/clasp create-deployment --deploymentId "$GAS_DEPLOYMENT_ID" --description "Production commit ${GITHUB_SHA:0:7}"

      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$HOME/.clasprc.json" .clasp.json
