name: Deploy Google Apps Script production

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Type DEPLOY only after the production target and release approvals have been verified"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apps-script-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_target == 'DEPLOY' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate application
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          node --check .github/scripts/verify-gas-target.mjs
          node --check .github/scripts/smoke-test-gas.mjs
          npm run build

      - name: Configure and verify live Apps Script target
        id: target
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
          EXPECTED_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
          EXPECTED_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON" || { echo "::error::Missing CLASPRC_JSON secret"; exit 1; }
          test -n "$CLASP_JSON" || { echo "::error::Missing CLASP_JSON secret"; exit 1; }
          test -n "$EXPECTED_SCRIPT_ID" || { echo "::error::Missing production variable GAS_SCRIPT_ID"; exit 1; }
          test -n "$EXPECTED_DEPLOYMENT_ID" || { echo "::error::Missing production secret GAS_DEPLOYMENT_ID"; exit 1; }
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json
          chmod 600 "$HOME/.clasprc.json" .clasp.json
          node .github/scripts/verify-gas-target.mjs

      - name: Update the verified existing Web App deployment
        env:
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          npx --yes @google/clasp create-deployment --deploymentId "$GAS_DEPLOYMENT_ID" --description "Production commit ${GITHUB_SHA:0:7}"

      - name: Smoke test deployed Web App health endpoint
        env:
          WEB_APP_URL: ${{ steps.target.outputs.web_app_url }}
        run: node .github/scripts/smoke-test-gas.mjs

      - name: Write deployment audit summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Apps Script production deployment audit"
            echo
            echo "- UTC time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Commit: $GITHUB_SHA"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Job outcome: ${{ job.status }}"
            echo "- Target verification: required before deployment via Apps Script Deployments API"
            echo "- Post-deployment health smoke test: required; final HTTP 200 and health JSON contract"
            echo "- Scope: updates existing verified Web App deployment; source sync remains separate"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$HOME/.clasprc.json" .clasp.json
