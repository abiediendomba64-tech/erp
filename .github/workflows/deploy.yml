name: Deploy Google Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Konfirmasi bahwa kode Apps Script target boleh ditimpa"
        required: true
        type: boolean
        default: false
      deployment_mode:
        description: "initial hanya untuk deploy pertama; update untuk memperbarui deployment yang ada"
        required: true
        type: choice
        options:
          - update
          - initial
        default: update

permissions:
  contents: read

concurrency:
  group: gas-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ (github.event_name == 'push' && vars.ENABLE_GAS_DEPLOY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.confirm_deploy) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.3
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Regression tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Setup clasp credentials safely
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$CLASPRC_JSON" ]]; then
            echo "::error::GitHub Actions secret CLASPRC_JSON belum diatur."
            exit 1
          fi
          if [[ -z "$CLASP_JSON" ]]; then
            echo "::error::GitHub Actions secret CLASP_JSON belum diatur."
            exit 1
          fi

          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json
          chmod 600 "$HOME/.clasprc.json" .clasp.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('.clasp.json', 'utf8'));
          if (!config.scriptId) throw new Error('.clasp.json harus memiliki scriptId.');
          if (config.rootDir !== 'google-apps-script') {
            throw new Error('CLASP_JSON.rootDir wajib bernilai "google-apps-script" agar file frontend tidak ikut di-push.');
          }
          for (const file of ['appsscript.json', 'Code.gs', 'Security.gs', 'Wrapper.html']) {
            if (!fs.existsSync('google-apps-script/' + file)) {
              throw new Error('File Apps Script tidak ditemukan: google-apps-script/' + file);
            }
          }
          NODE

      - name: Push source and deploy
        shell: bash
        env:
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode || 'update' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # clasp push replaces the remote Apps Script project's source files.
          npx --yes @google/clasp push --force

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DEPLOYMENT_MODE" == "initial" ]]; then
            echo "Creating the first web-app deployment. Save its deployment ID as the GAS_DEPLOYMENT_ID repository secret before future updates."
            npx --yes @google/clasp create-deployment --description "Initial deployment ${GITHUB_SHA:0:7}"
          else
            if [[ -z "$GAS_DEPLOYMENT_ID" ]]; then
              echo "::error::GAS_DEPLOYMENT_ID belum diatur. Jalankan workflow manual dengan deployment_mode=initial sekali, atau tambahkan secret ID deployment yang sudah ada."
              exit 1
            fi
            npx --yes @google/clasp create-deployment --deploymentId "$GAS_DEPLOYMENT_ID" --description "GitHub Actions ${GITHUB_SHA:0:7}"
          fi
