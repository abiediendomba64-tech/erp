name: ERP CI - Apps Script and release validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ERP CI / Apps Script syntax, release scripts, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Apps Script syntax check
        run: node --check < google-apps-script/Code.gs
      - name: Validate release helper script syntax
        run: |
          node --check .github/scripts/verify-gas-target.mjs
          node --check .github/scripts/smoke-test-gas.mjs
      - name: Accounting regression tests
        run: npm test
      - name: Production build
        run: npm run build
