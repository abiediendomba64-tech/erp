name: Sync Google Apps Script production source

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Type SYNC only after verifying the production Script ID and existing deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apps-script-production-source-sync
  cancel-in-progress: false

jobs:
  sync-source:
    if: ${{ inputs.confirm_target == 'SYNC' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate application
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          node --check .github/scripts/verify-gas-target.mjs
          node --check .github/scripts/smoke-test-gas.mjs
          npm run build

      - name: Configure and verify live Apps Script target
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
          EXPECTED_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
          EXPECTED_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON" || { echo "::error::Missing CLASPRC_JSON secret"; exit 1; }
          test -n "$CLASP_JSON" || { echo "::error::Missing CLASP_JSON secret"; exit 1; }
          test -n "$EXPECTED_SCRIPT_ID" || { echo "::error::Missing production variable GAS_SCRIPT_ID"; exit 1; }
          test -n "$EXPECTED_DEPLOYMENT_ID" || { echo "::error::Missing production secret GAS_DEPLOYMENT_ID"; exit 1; }
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json
          chmod 600 "$HOME/.clasprc.json" .clasp.json
          node .github/scripts/verify-gas-target.mjs

      - name: Sync source without force
        run: npx --yes @google/clasp push

      - name: Write source-sync audit summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Apps Script production source-sync audit"
            echo
            echo "- UTC time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Commit: $GITHUB_SHA"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Job outcome: ${{ job.status }}"
            echo "- Target verification: exact Script ID and existing Web App Deployment ID verified before source push"
            echo "- Scope: source sync only; does not create or update a deployment"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
